server
{
    listen 8080;
    server_name localhost;
    host 127.0.0.1;

    # / Root location answering  -- must answer to GET request ONLY
    location /
    {
        allow_methods GET;
        root ./YoupiBanane;
        index youpi.bad_extension;
    }

    # /put_test/* must answer to PUT request 
    # and save files to a directory of your choice (uploads)
    location /put_test/
    {
        allow_methods PUT;
        root ./YoupiBanane;
        upload_store ./YoupiBanane/uploads;
    }

    # Any file with .bla extension must answer to POST request 
    #   by calling the cgi_test executable (./ubuntu_cgi_tester)
    location *.bla
    {
        allow_methods POST;
        client_max_body_size 100M;
        cgi_pass ./ubuntu_cgi_tester;
    }

    # /post_body must answer anything to POST request with a maxBody of 100
    location /post_body
    {
        allow_methods POST;
        client_max_body_size 100;
        root ./YoupiBanane;
        index youpi.bad_extension;
        upload_path ./YoupiBanane/uploads;
    }

    # /directory/ must answer to GET request and the root of it would be
    # the repository YoupiBanane and if no file are requested, 
    # it should search for youpi.bad_extension files
    location /directory/
    {
        allow_methods GET;
        root ./YoupiBanane;
        index youpi.bad_extension;
    }
}
